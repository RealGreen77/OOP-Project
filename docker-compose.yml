# I-ITSM full stack: PostgreSQL + Mailpit (SMTP catcher) + Spring Boot API + React/nginx frontend.
#   docker compose up --build
#   App:      http://localhost:3000
#   API docs: http://localhost:8080/swagger-ui.html
#   Mailbox:  http://localhost:8025   (every e-mail notification lands here)
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: itsm
      POSTGRES_USER: ${DB_USERNAME:-itsm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-itsm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-itsm} -d itsm"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"   # web UI
      - "1025:1025"   # SMTP

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://db:5432/itsm
      DB_USERNAME: ${DB_USERNAME:-itsm}
      DB_PASSWORD: ${DB_PASSWORD:-itsm}
      JWT_SECRET: ${JWT_SECRET:-docker-compose-demo-secret-change-me-32-bytes-min}
      # Defaults deliver to the Mailpit catcher. Set the SMTP_* values in .env to send real e-mail.
      EMAIL_MODE: smtp
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-servicedesk@itsm.local}
      SIMULATED_EMAIL_DOMAINS: ${SIMULATED_EMAIL_DOMAINS:-}
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
