# =====================================================================================
# I-ITSM backend configuration. Every value can be overridden with environment variables
# (e.g. DB_URL, JWT_SECRET) - see docker-compose.yml and .env.example.
# =====================================================================================
spring:
  application:
    name: itsm-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/itsm}
    username: ${DB_USERNAME:itsm}
    password: ${DB_PASSWORD:itsm}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway migrations
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}      # empty for Mailpit; set for a real provider (e.g. Gmail)
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 3000
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: true               # Java 21 virtual threads for request handling

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
  compression:
    enabled: true

management:
  health:
    mail:
      enabled: false        # e-mail is best-effort (failures are logged per delivery), not a liveness concern
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

itsm:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-this-is-a-32-byte-minimum-dev-secret}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
    issuer: i-itsm
  security:
    max-failed-logins: 5
    lock-minutes: 15
    email-verification-required: ${EMAIL_VERIFICATION_REQUIRED:true}
    verification-code-minutes: 10
    verification-max-attempts: 5
    verification-resend-seconds: 30
    password-reset-minutes: 30
  sla:
    monitor-interval-ms: ${SLA_MONITOR_INTERVAL_MS:60000}
    auto-escalation: true
    scheduler-enabled: true
  intelligence:
    duplicate-window-hours: 72
    correlation-window-hours: 24
    major-incident-threshold: 3
  notifications:
    email-mode: ${EMAIL_MODE:log}          # "smtp" (Mailpit / real SMTP) or "log" (simulated)
    from-address: ${MAIL_FROM:servicedesk@itsm.local}
    sms-enabled: true
    # Recipients on these domains (e.g. the seeded demo accounts) are not e-mailed; delivery is logged as SIMULATED.
    simulated-email-domains: ${SIMULATED_EMAIL_DOMAINS:}
    frontend-base-url: ${FRONTEND_URL:http://localhost:5173}
  cors-allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost}
  seed-demo-data: ${SEED_DEMO_DATA:true}

logging:
  level:
    com.itsm: INFO
    org.hibernate.SQL: WARN
    # benign warning when a lazy User proxy is narrowed to its TeamLead subclass
    org.hibernate.engine.internal.StatefulPersistenceContext: ERROR
