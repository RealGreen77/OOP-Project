# Test profile: in-memory H2 in PostgreSQL compatibility mode. Flyway runs the real migrations and
# Hibernate validates the entity mapping against them, so schema drift is caught by the test suite.
spring:
  datasource:
    url: jdbc:h2:mem:itsm;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  threads:
    virtual:
      enabled: false

itsm:
  sla:
    scheduler-enabled: false
  notifications:
    email-mode: log
  seed-demo-data: true

logging:
  level:
    com.itsm: WARN
    org.springframework: WARN
    org.hibernate: WARN
